<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>page of blu</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="BG">
    <div id="TopBar" class="TopBar">
      <p>bluOS</p>
      <div class="appBar">
        <img
          id="welcomeApp"
          class="app"
          src="imgs&gifs\OIP.png"
          alt="welcome app"
        />
        <img
          id="noteApp"
          class="app"
          src="imgs&gifs/blu notes.png"
          alt="note app"
        />
        <img
          id="blogApp"
          class="app"
          src="imgs&gifs\blu blog.png"
          alt="welcome app"
        />
        <img class="app" src="imgs&gifs\OIP.png" alt="welcome app" />
        <img class="app" src="imgs&gifs\OIP.png" alt="welcome app" />
        <img class="app" src="imgs&gifs\OIP.png" alt="welcome app" />
        <img class="app" src="imgs&gifs\OIP.png" alt="welcome app" />
      </div>
      <p id="clock" class="time">7/26/2026 10:06 pm</p>
    </div>
    <div id="root" class="Root">
      <div id="blog" class="Window" style="display: none">
        <div id="blogheader" class="header">
          <h1 class="title">Blu's blog</h1>
          <p id="blogclose" class="closeBtn">X</p>
        </div>
        <hr class="sep" />
        <div id="blogcontent" class="content">
          <div id="main" class="post">
            <div class="title">first</div>
            <div class="date">8/18/2026 10:45pm</div>
            <div class="sep"></div>
            <div class="body">hi this is the first test</div>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
