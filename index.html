<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>page of blu</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="BG">
    <div id="TopBar" class="TopBar">
      <p>bluOS</p>
      <div class="appBar">
        <img
          id="welcomeApp"
          class="app"
          src="imgs&gifs\OIP.png"
          alt="welcome app"
        />
        <img
          id="noteApp"
          class="app"
          src="imgs&gifs/blu notes.png"
          alt="note app"
        />
        <img class="app" src="imgs&gifs\OIP.png" alt="welcome app" />
        <img class="app" src="imgs&gifs\OIP.png" alt="welcome app" />
        <img class="app" src="imgs&gifs\OIP.png" alt="welcome app" />

      </div>
      <p id="clock" class="time">7/26/2026 10:06 pm</p>
    </div>
    <div class="Root">
      <div id="note" class="Window">
        <div id="noteheader" class="header">
          <h1 class="title">notes</h1>
          <p class="closeBtn">X</p>
        </div>
        <hr class="sep" />
        <button id="format" class="format">format</button>
        <div id="write" contenteditable="true">
          <span>hello you can write in this box and maybe format idk</span>
        </div>
      </div>
      <div id="welcome" class="Window">
        <div id="welcomeheader" class="header">
          <h1 class="title">welcome</h1>
          <p class="closeBtn">X</p>
        </div>
        <hr class="sep" />
        <p>
          welcome to the bluOS. this is a OS for stardance. a program from
          hackclub that teens can do.
        </p>
        <p>
          link<br />
          <span style="padding-left: 5px">&#8595;</span>
        </p>
        <a href="https://stardance.hackclub.com/">hackclub's stardance</a>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
